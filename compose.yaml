# 로컬 개발용: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: meetup-postgres-local
    environment:
      POSTGRES_DB: meetup
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: meetup
    ports:
      - "5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meetup-redis-local
    ports:
      - "6379:6379"

volumes:
  pgdata-local:
